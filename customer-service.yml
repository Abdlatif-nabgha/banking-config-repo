server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customerdb
    username: customer_user
    password: customer_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
  ai:
    mcp:
      server:
        protocol: streamable
