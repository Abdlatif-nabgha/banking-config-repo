server:
  port: 8083

spring:
  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
    mcp:
      client:
        streamable-http:
          connections:
            customer:
              url: http://localhost:8080
              endpoint: /mcp