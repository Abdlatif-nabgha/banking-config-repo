# ── 1. CONFIGURATION COMMUNE SERVEUR (Pour que Swagger honore les URLs de la Gateway)
server:
  forward-headers-strategy: framework

# ── 2. CONFIGURATION COMMUNE EUREKA (Pour que tous les services se connectent à l'annuaire)
eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── 3. CONFIGURATION COMMUNE ACTUATOR (Monitoring et Rechargement à chaud)
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers
  endpoint:
    health:
      show-details: always

# ── 4. CONFIGURATION COMMUNE JPA / HIBERNATE (Formatage propre des logs SQL)
spring:
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
