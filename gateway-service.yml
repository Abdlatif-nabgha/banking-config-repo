server:
  port: 8888

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ── BUSINESS ROUTES ───────────────────────────────────────────
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**

            - id: chatboot-service
              uri: lb://chatboot-service
              predicates:
                - Path=/chat/**, /api/v1/chat/**

            # ── SWAGGER / OPENAPI DOC ROUTES ──────────────────────────────
            - id: customer-service-docs
              uri: lb://customer-service
              predicates:
                - Path=/customer-service/v3/api-docs/**
              filters:
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}

            - id: account-service-docs
              uri: lb://account-service
              predicates:
                - Path=/account-service/v3/api-docs/**
              filters:
                - RewritePath=/account-service/(?<segment>.*), /$\{segment}

            - id: transaction-service-docs
              uri: lb://transaction-service
              predicates:
                - Path=/transaction-service/v3/api-docs/**
              filters:
                - RewritePath=/transaction-service/(?<segment>.*), /$\{segment}

            - id: chatboot-service-docs
              uri: lb://chatboot-service
              predicates:
                - Path=/chatboot-service/v3/api-docs/**
              filters:
                - RewritePath=/chatboot-service/(?<segment>.*), /$\{segment}

# ── CENTRALIZED SWAGGER UI DROPDOWN ────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Customer Service API
        url: /customer-service/v3/api-docs
      - name: 2. Account Service API
        url: /account-service/v3/api-docs
      - name: 3. Transaction Service API
        url: /transaction-service/v3/api-docs
      - name: 4. Chatbot Service API
        url: /chatboot-service/v3/api-docs
